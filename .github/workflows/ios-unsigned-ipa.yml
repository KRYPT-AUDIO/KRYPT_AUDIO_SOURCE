name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ios-unsigned-ipa

permissions:
  contents: read

concurrency:
  group: ios-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'
  IOS_SCHEME: Runner

jobs:
  build:
    name: Build KRYPT AUDIO unsigned IPA
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Prepare iOS host project
        run: bash scripts/prepare_ios.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/${IOS_SCHEME}.app"
          IPA_DIR="build/ios/ipa"
          test -d "$APP_PATH"
          rm -rf "$IPA_DIR/Payload"
          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP_PATH" "$IPA_DIR/Payload/"
          (
            cd "$IPA_DIR"
            zip -qry "KRYPT-AUDIO-${GITHUB_SHA::7}-unsigned.ipa" Payload
          )
          rm -rf "$IPA_DIR/Payload"
          ls -lh "$IPA_DIR"/*.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: KRYPT-AUDIO-ios-unsigned-${{ github.sha }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30
