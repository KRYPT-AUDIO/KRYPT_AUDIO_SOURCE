name: Build Universal Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: universal-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  FLUTTER_CHANNEL: stable

jobs:
  build:
    name: Build universal release APK
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version: \([0-9][0-9.]*\)+.*$/\1/p' pubspec.yaml | head -n 1)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=V$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Prepare Android signing key
        id: signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.KRYPT_ANDROID_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KRYPT_ANDROID_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KRYPT_ANDROID_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KRYPT_ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${SIGNING_KEYSTORE_BASE64:-}" && -n "${SIGNING_STORE_PASSWORD:-}" && -n "${SIGNING_KEY_PASSWORD:-}" && -n "${SIGNING_KEY_ALIAS:-}" ]]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
            cat > android/key.properties <<EOF
          storePassword=$SIGNING_STORE_PASSWORD
          keyPassword=$SIGNING_KEY_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          storeFile=app/key.jks
          EOF
            echo 'Using the configured KRYPT Android release signing key.'
            echo 'production_signing=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Production signing secrets are not configured; generating a CI-only signing key.'
            keytool -genkeypair -v \
              -keystore android/app/key.jks \
              -storepass krypt-ci-only \
              -keypass krypt-ci-only \
              -alias krypt-audio-ci \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -dname 'CN=KRYPT AUDIO CI, O=Synapse Labs UK Ltd, C=GB'
            cat > android/key.properties <<'EOF'
          storePassword=krypt-ci-only
          keyPassword=krypt-ci-only
          keyAlias=krypt-audio-ci
          storeFile=app/key.jks
          EOF
            echo 'production_signing=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build universal APK
        run: flutter build apk --release --flavor github

      - name: Verify APK and calculate checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-github-release.apk
          test -s "$APK"
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner -perm -111 | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          APK_DIR="$(dirname "$APK")"
          APK_FILE="$(basename "$APK")"
          (
            cd "$APK_DIR"
            sha256sum "$APK_FILE" | tee "$APK_FILE.sha256"
          )
          file "$APK"

      - name: Upload universal APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: KRYPT-AUDIO-universal-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-github-release.apk
            build/app/outputs/flutter-apk/app-github-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: ${{ steps.signing.outputs.production_signing == 'true' && github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_version.outputs.tag }}
          name: KRYPT Audio V${{ steps.app_version.outputs.version }} — Automatic Update
          body: |
            Automated universal Android release for KRYPT AUDIO V${{ steps.app_version.outputs.version }}.

            This release was built from commit `${{ github.sha }}` and includes the APK produced by the `main` branch workflow.
          make_latest: true
          files: |
            build/app/outputs/flutter-apk/app-github-release.apk
            build/app/outputs/flutter-apk/app-github-release.apk.sha256

      - name: Clean signing material
        if: always()
        run: rm -f android/app/key.jks android/key.properties
